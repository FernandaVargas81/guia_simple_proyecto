<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renovación de Pasaporte - Guía Simple</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { orange: '#EA580C', 'orange-hover': '#C2410C', teal: '#0D9488', bg: '#FAFAF9' } } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col font-sans antialiased">

  <header class="sticky top-0 z-40 bg-white border-b border-stone-200/80 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-orange to-amber-500 flex items-center justify-center text-white font-bold text-xl">G</div>
        <span class="font-display font-black text-xl tracking-tight text-stone-950">Guía<span class="text-brand-orange">Simple</span></span>
      </a>
      <nav class="hidden md:flex items-center gap-1">
        <a href="../index.html" class="px-4 py-2 rounded-full text-sm font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100">Explorar</a>
        <a href="panel.html" class="px-4 py-2 rounded-full text-sm font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100">Mi Panel & Mapas</a>
        <a href="soporte.html" class="px-4 py-2 rounded-full text-sm font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100">Comunidad & Soporte</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-8">
    <div class="space-y-6">
      <a href="../index.html" class="inline-flex items-center gap-1 text-xs font-bold text-stone-500 hover:text-stone-900">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a Explorar
      </a>
      
      <div class="bg-white border border-stone-200/80 rounded-3xl p-6 shadow-sm space-y-4">
        <div class="flex items-center justify-between gap-4">
          <h1 class="font-display font-black text-2xl text-stone-950">Renovación de Pasaporte</h1>
          <span id="progress-badge" class="shrink-0 text-[10px] font-bold uppercase tracking-wider text-brand-orange bg-orange-50 px-3 py-1 rounded-full">0% Completado</span>
        </div>
        <p class="text-xs text-stone-500">Sigue el orden de esta lista de tareas. Tu progreso se guarda automáticamente en tu cuenta.</p>

        <div class="space-y-3 pt-4" id="checklist" data-tramite="pasaporte"></div>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/checklist.js"></script>
</body>
</html>
